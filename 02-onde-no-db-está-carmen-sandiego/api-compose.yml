services:
  node-api:
    build: ./node-api
    container_name: carmen-node-api
    environment:
      MONGO_URL: mongodb://mongo:${MONGO_INTERNAL_PORT}/${MONGO_DB}
      PORT: ${NODE_API_INTERNAL_PORT}
    ports:
      - "${BIND_HOST}:${NODE_API_PORT}:${NODE_API_INTERNAL_PORT}"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${NODE_API_INTERNAL_PORT}/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [carmen-net]
    profiles: [full]

  parity-tests:
    # one-shot: sobe via `docker compose run`, exit code = veredito da suíte
    build:
      context: ./parity
      args:
        BRUNO_VERSION: ${BRUNO_CLI_VERSION}
    volumes:
      - ./bruno:/src:ro
    environment:
      BRUNO_ENVS: node-container
    depends_on:
      node-api:
        condition: service_healthy
    networks: [carmen-net]
    profiles: [parity]