# bancos do lab carmen — estrutura pura; TODOS os valores vivem no .env
# (bootstrap: cp .env.example .env — ou make up, que faz isso automaticamente)

name: carmen

services:
  postgres:
    image: postgres:17
    container_name: carmen-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${BIND_HOST}:${POSTGRES_PORT}:${PG_INTERNAL_PORT}"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p ${PG_INTERNAL_PORT}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [carmen-net]

  mongo:
    image: mongo:8
    container_name: carmen-mongo
    ports:
      - "${BIND_HOST}:${MONGO_PORT}:${MONGO_INTERNAL_PORT}"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [carmen-net]

volumes:
  pg_data:
    name: ${PG_VOLUME}
  mongo_data:
    name: ${MONGO_VOLUME}

networks:
  carmen-net:
    name: carmen-net