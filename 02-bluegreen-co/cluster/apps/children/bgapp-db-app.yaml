apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bgapp-db
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/emnsilva/paranauelabs.git'
    targetRevision: HEAD
    path: 02-bluegreen-co/cluster/apps/children/db
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: bluegreen
  syncPolicy:
    automated:
      prune: true
      selfHeal: true