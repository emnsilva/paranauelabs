apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://cloudnative-pg.github.io/charts'
    chart: cloudnative-pg
    targetRevision: 0.24.0 # <-- Chart mais recente
    helm:
      values: |
        image:
          tag: "1.25.1" # <-- Força a versão do operador que corrige o bug
        resources:
          requests:
            memory: "50Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: bluegreen
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true