apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://cloudnative-pg.github.io/charts'
    chart: cloudnative-pg
    targetRevision: 0.23.0
    helm:
      values: |
        image:
          tag: "1.24.3"
        certManager:
          enabled: false
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        # Desabilita os probes para evitar o CrashLoopBackOff
        livenessProbe:
          enabled: false
        readinessProbe:
          enabled: false
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: bluegreen
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true