name: Terraform Pipeline (AWS)

on:
  workflow_dispatch:

jobs:
  # Job 1: A Porta de Aprovação (GMUD)
  approval_gate:
    runs-on: ubuntu-latest
    environment: dev # Pausa aqui esperando você aprovar
    steps:
      - name: Aguardando Aprovação
        run: echo "Deploy aprovado pelo Tech Lead. Iniciando esteira..."

  # Job 2: Validate (Roda automático após a aprovação)
  validate:
    needs: approval_gate
    runs-on: ubuntu-latest
    environment: dev # Puxa as secrets, mas NÃO pede aprovação de novo
    defaults:
      run:
        working-directory: 01-iac-railways/terraform/aws
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0
      - name: Terraform Init
        run: terraform init
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_app_terraform_io }}
          TF_WORKSPACE: ${{ vars.TF_WORKSPACE_AWS }}
      - name: Terraform Validate
        run: terraform validate

  # Job 3: Plan (Roda automático após o validate)
  plan:
    needs: validate
    runs-on: ubuntu-latest
    environment: dev # Puxa as secrets, mas NÃO pede aprovação de novo
    defaults:
      run:
        working-directory: 01-iac-railways/terraform/aws
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0
      - name: Terraform Init
        run: terraform init
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_app_terraform_io }}
          TF_WORKSPACE: ${{ vars.TF_WORKSPACE_AWS }}
      - name: Terraform Plan
        run: terraform plan
        env:
          TF_VAR_environment: 'dev'

  # Job 4: Apply (Roda automático após o plan)
  apply:
    needs: plan
    runs-on: ubuntu-latest
    environment: dev # Puxa as secrets, mas NÃO pede aprovação de novo
    defaults:
      run:
        working-directory: 01-iac-railways/terraform/aws
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0
      - name: Terraform Init
        run: terraform init
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_app_terraform_io }}
          TF_WORKSPACE: ${{ vars.TF_WORKSPACE_AWS }}
      - name: Terraform Apply
        run: terraform apply -auto-approve
        env:
          TF_VAR_environment: 'dev'