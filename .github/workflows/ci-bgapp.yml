name: CI - bgapp

on:
  workflow_dispatch: # Permite acionamento manual via interface do GitHub

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./02-bluegreen-co/app

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '02-bluegreen-co/app/requirements.txt'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar testes unitários
        run: python -m pytest tests/