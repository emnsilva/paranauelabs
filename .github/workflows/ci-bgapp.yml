name: CI - Build, Scan e Deploy GitOps

on:
  workflow_dispatch: # Deploy manual
    inputs:
      version_tag:
        description: 'Tag da versão (ex: v1.0.2)'
        required: true
        default: 'v1.0.2'
        type: string
  pull_request: # Roda apenas os testes quando um PR é aberto
    branches: [ "main" ]
    paths:
      - '02-bluegreen-co/app/**'

permissions:
  contents: write # Necessário para fazer o commit da nova tag
  packages: write # Necessário para publicar no GHCR

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/bgapp

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./02-bluegreen-co/app

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '02-bluegreen-co/app/requirements.txt'

      - name: Instalar dependências e rodar testes
        run: |
          pip install -r requirements.txt
          python -m pytest tests/

      # DAQUI PARA BAIXO SÓ RODA SE FOR WORKFLOW_DISPATCH (MANUAL)
      - name: Configurar Docker Buildx
        if: github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da Imagem
        if: github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          context: ./02-bluegreen-co/app
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.version_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan de Vulnerabilidades (Trivy)
        if: github.event_name == 'workflow_dispatch'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.version_tag }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Instalar yq
        if: github.event_name == 'workflow_dispatch'
        run: |
          wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x /usr/local/bin/yq
          yq --version

      - name: Atualizar Tag no GitOps
        if: github.event_name == 'workflow_dispatch'
        working-directory: . # Volta para a raiz para mexer no cluster
        run: |
          FILE="02-bluegreen-co/cluster/apps/children/bgapp/deployment.yaml"
          yq e -i '.spec.template.spec.containers[0].image = "ghcr.io/'"${{ github.repository }}"'/bgapp:'"${{ github.event.inputs.version_tag }}"'"' $FILE
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add $FILE
          if git diff --cached --quiet; then
            echo "Nenhuma mudança na imagem. A tag ${{ github.event.inputs.version_tag }} já está em uso."
          else
            git commit -m "chore(gitops): atualiza imagem do bgapp para ${{ github.event.inputs.version_tag }} [skip ci]"
            git push
            echo "Tag atualizada com sucesso no GitOps!"
          fi