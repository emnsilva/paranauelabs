name: CI - bgapp

on:
  workflow_dispatch: # Permite acionamento manual via interface do GitHub

permissions:
  contents: read
  packages: write # Necessário para publicar no GHCR

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./02-bluegreen-co/app

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '02-bluegreen-co/app/requirements.txt'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar testes unitários
        run: python -m pytest tests/

      - name: Login no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da Imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: ./02-bluegreen-co/app
          push: true
          # O nome da imagem será ghcr.io/seu-usuario/paranauelabs/bgapp:latest
          tags: ghcr.io/${{ github.repository }}/bgapp:v1.0.0
          cache-from: type=gha
          cache-to: type=gha,mode=max