name: CI - Build, Scan e Deploy GitOps

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag da versão (ex: v1.0.1)'
        required: true
        default: 'v1.0.1'
        type: string

permissions:
  contents: write # Necessário para fazer o commit da nova tag
  packages: write # Necessário para publicar no GHCR

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/bgapp

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./02-bluegreen-co/app

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '02-bluegreen-co/app/requirements.txt'

      - name: Instalar dependências e rodar testes
        run: |
          pip install -r requirements.txt
          python -m pytest tests/

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da Imagem
        uses: docker/build-push-action@v5
        with:
          context: ./02-bluegreen-co/app
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.version_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan de Vulnerabilidades (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.version_tag }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Instalar yq
        run: |
          wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x /usr/local/bin/yq
          yq --version

      - name: Atualizar Tag no GitOps
        working-directory: . # Volta para a raiz para mexer no cluster
        run: |
          # Caminho do arquivo de deployment
          FILE="02-bluegreen-co/cluster/apps/children/bgapp/deployment.yaml"
          
          # Atualiza a tag da imagem usando yq
          yq e -i '.spec.template.spec.containers[0].image = "ghcr.io/'"${{ github.repository }}"'/bgapp:'"${{ github.event.inputs.version_tag }}"'"' $FILE
          
          # Configura o Git para fazer o commit
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          # Faz o commit e push
          git add $FILE
          git commit -m "chore(gitops): atualiza imagem do bgapp para ${{ github.event.inputs.version_tag }} [skip ci]"
          git push